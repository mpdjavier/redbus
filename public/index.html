<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tucumán Bus Radar - Destino</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --surface: #ffffff;
            --background: #f3f4f6;
            --text: #1f2937;
            --text-secondary: #6b7280;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
            background: var(--background);
            color: var(--text);
        }

        /* Sidebar & Panel */
        #panel {
            width: 380px;
            background: var(--surface);
            display: flex;
            flex-direction: column;
            z-index: 2000;
            box-shadow: 4px 0 24px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .panel-header {
            padding: 12px 20px;
            border-bottom: 1px solid #e5e7eb;
        }

        h1 {
            font-size: 20px;
            font-weight: 700;
            margin: 0 0 4px 0;
            background: linear-gradient(to right, #2563eb, #7c3aed);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            margin: 0;
        }

        /* Search Container */
        .search-container {
            position: relative;
            margin-bottom: 12px;
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px;
            padding-left: 40px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.2s;
            box-sizing: border-box;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        /* Autocomplete */
        #autocomplete-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            margin-top: 4px;
            max-height: 300px;
            overflow-y: auto;
            box-shadow: var(--shadow);
            z-index: 1000;
            display: none;
        }

        .autocomplete-item {
            padding: 12px 16px;
            cursor: pointer;
            border-bottom: 1px solid #f3f4f6;
            transition: background 0.15s;
        }

        .autocomplete-item:last-child {
            border-bottom: none;
        }

        .autocomplete-item:hover {
            background: #f9fafb;
        }

        /* Content Area */
        #content {
            flex-grow: 1;
            overflow-y: auto;
            padding: 0;
            max-height: calc(100vh - 280px);
        }

        /* Line Cards */
        .line-card {
            padding: 16px 24px;
            border-bottom: 1px solid #f3f4f6;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .line-card:hover {
            background: #f9fafb;
        }

        .line-badge {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            flex-shrink: 0;
        }

        .line-info {
            flex-grow: 1;
        }

        .line-name {
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 4px;
        }

        .line-meta {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* Back Button */
        #back-btn {
            display: none;
            padding: 8px 16px;
            background: #e5e7eb;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 12px;
            transition: background 0.2s;
        }

        #back-btn:hover {
            background: #d1d5db;
        }

        /* Map */
        #map {
            flex-grow: 1;
            height: 100%;
        }

        /* Progress Bar */
        #calculating-bar {
            display: none;
            margin-top: 10px;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }

            #panel {
                width: 100%;
                height: 40%;
                box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.1);
                order: 2;
            }

            #content {
                max-height: calc(40vh - 200px);
            }

            #map {
                height: 60%;
                order: 1;
            }

            .panel-header {
                padding: 12px 16px;
            }

            h1 {
                font-size: 20px;
            }

            .line-card {
                padding: 12px 16px;
            }
        }
    </style>
</head>

<body>

    <div id="panel">
        <div class="panel-header">
            <button id="back-btn" onclick="goBack()">← Volver</button>
            <h1>Bus Radar <span id="build-timestamp" style="font-size: 12px; color: #9ca3af; font-weight: 400;"></span>
            </h1>
            <p class="subtitle" id="status-text">Ingresa tu destino para ver sugerencias.</p>

            <!-- Origin -->
            <div class="search-container" id="origin-container" style="margin-bottom: 12px;">
                <span class="search-icon" style="color:#10b981;">🟢</span>
                <input type="text" id="origin" class="search-input" placeholder="¿Desde dónde sales?" autocomplete="off"
                    style="padding-right: 75px;">
                <button id="map-btn-origin" title="Elegir en Mapa"
                    style="position:absolute; right:40px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; font-size:18px; color:#6b7280;">🗺️</button>
                <button id="gps-btn" title="Mi Ubicación"
                    style="position:absolute; right:8px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; font-size:18px; color:#6b7280;">📍</button>
            </div>

            <!-- Destination -->
            <div class="search-container" id="search-box-container">
                <span class="search-icon" style="color:#ef4444;">🔴</span>
                <input type="text" id="destination" class="search-input" placeholder="¿A dónde vas?" autocomplete="off"
                    style="padding-right: 75px;">
                <button id="map-btn-dest" title="Elegir en Mapa"
                    style="position:absolute; right:40px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; font-size:18px; color:#6b7280;">🗺️</button>
                <button id="fav-btn"
                    style="position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; font-size:18px; color:#9ca3af; display:none;">★</button>
                <div id="autocomplete-list"></div>
            </div>

            <!-- Walking Distance Control -->
            <div style="margin: 16px 0; padding: 12px; background: #f9fafb; border-radius: 8px;">
                <label style="display: block; font-size: 13px; color: #6b7280; margin-bottom: 8px;">
                    🚶 Distancia máxima de caminata: <strong id="walk-dist-label">800m</strong>
                </label>
                <input type="range" id="walk-distance-slider" min="200" max="1500" step="100" value="800"
                    style="width: 100%; cursor: pointer;">
            </div>

            <div id="calculating-bar" style="display:none; margin-top: 10px;">
                <div style="height:4px; background:#e5e7eb; border-radius:2px; overflow:hidden;">
                    <div id="progress-fill"
                        style="width:0%; height:100%; background:var(--primary); transition: width 0.3s;"></div>
                </div>
                <div style="font-size:11px; color:#6b7280; text-align:right; margin-top:4px;">Analizando rutas...</div>
            </div>
        </div>

        <div id="content">
            <!-- Favorites List -->
            <div id="favorites-list" style="padding: 16px; display:none;"></div>

            <!-- Dynamic Content -->
            <div id="empty-state" style="padding: 40px; text-align: center; color: #9ca3af;">
                <div style="font-size: 48px; margin-bottom: 16px;">🗺️</div>
                <p>Busca una dirección en San Miguel de Tucumán o Yerba Buena.</p>
            </div>
        </div>
    </div>

    <div id="map"></div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="api.js"></script>
    <script src="geometry.js"></script>

    <script>
        // Setup Map
        const map = L.map('map').setView([-26.83, -65.20], 13);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        // Global Variables
        let currentLines = [];
        let maxWalkDistance = 800;

        // Update timestamp
        const now = new Date();
        const day = String(now.getDate()).padStart(2, '0');
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        document.getElementById('build-timestamp').textContent = `${day}/${month} ${hours}:${minutes}`;

        // Walking distance slider
        document.getElementById('walk-distance-slider').addEventListener('input', (e) => {
            maxWalkDistance = parseInt(e.target.value);
            document.getElementById('walk-dist-label').textContent = maxWalkDistance + 'm';
        });

        // Initialize - Load lines
        async function init() {
            try {
                currentLines = await BusAPI.getLines();
                console.log(`Loaded ${currentLines.length} unique lines`);
            } catch (e) {
                console.error("Failed to load lines", e);
            }
        }
        init();

        init();

        // === AUTOCOMPLETE & SEARCH ===
        const destInput = document.getElementById('destination');
        const originInput = document.getElementById('origin');
        const autocompleteList = document.getElementById('autocomplete-list');
        let currentPlace = null;
        let originLocation = null;
        let activeField = 'destination';

        // Nominatim Search
        async function searchNominatim(query) {
            if (query.length < 3) return [];
            try {
                const res = await axios.get('https://nominatim.openstreetmap.org/search', {
                    params: {
                        q: query + ', San Miguel de Tucumán, Argentina',
                        format: 'json',
                        limit: 5,
                        addressdetails: 1
                    }
                });
                return res.data;
            } catch (e) {
                console.error('Nominatim error:', e);
                return [];
            }
        }

        // Show Autocomplete
        function showAutocomplete(results) {
            if (results.length === 0) {
                autocompleteList.style.display = 'none';
                return;
            }

            autocompleteList.innerHTML = '';
            results.forEach(item => {
                const div = document.createElement('div');
                div.className = 'autocomplete-item';
                div.innerHTML = `<strong>${item.display_name.split(',')[0]}</strong><br><small>${item.display_name}</small>`;
                div.onclick = () => selectPlace(item);
                autocompleteList.appendChild(div);
            });
            autocompleteList.style.display = 'block';
        }

        // Select Place
        function selectPlace(place) {
            const lat = parseFloat(place.lat);
            const lon = parseFloat(place.lon);

            if (activeField === 'destination') {
                currentPlace = { lat, lon, display_name: place.display_name, alias: place.display_name.split(',')[0] };
                destInput.value = place.display_name.split(',')[0];
                document.getElementById('fav-btn').style.display = 'block';

                // Find best lines for this destination
                findBestLines({ lat, lng: lon }, originLocation);
            } else {
                originLocation = { lat, lng: lon };
                originInput.value = place.display_name.split(',')[0];
            }

            autocompleteList.style.display = 'none';
            map.setView([lat, lon], 15);
            L.marker([lat, lon]).addTo(map);
        }

        // Destination Input
        destInput.addEventListener('input', async (e) => {
            activeField = 'destination';
            const query = e.target.value;
            if (query.length >= 3) {
                const results = await searchNominatim(query);
                showAutocomplete(results);
            } else {
                autocompleteList.style.display = 'none';
            }
        });

        // Origin Input
        originInput.addEventListener('input', async (e) => {
            activeField = 'origin';
            const query = e.target.value;
            if (query.length >= 3) {
                const results = await searchNominatim(query);
                showAutocomplete(results);
            } else {
                autocompleteList.style.display = 'none';
            }
        });

        // GPS Button
        document.getElementById('gps-btn').addEventListener('click', () => {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((pos) => {
                    originLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                    originInput.value = "Mi ubicación";
                    map.setView([originLocation.lat, originLocation.lng], 15);
                    L.marker([originLocation.lat, originLocation.lng]).addTo(map);
                }, (err) => {
                    console.error("No se pudo obtener ubicación:", err.message);
                    originInput.value = "";
                });
            }
        });

        // Map Selection Mode
        let mapSelectionMode = null;
        let tempMarker = null;

        document.getElementById('map-btn-origin').addEventListener('click', () => {
            mapSelectionMode = 'origin';
            map.getContainer().style.cursor = 'crosshair';
            document.getElementById('status-text').innerText = "Haz clic en el mapa para seleccionar origen";
        });

        document.getElementById('map-btn-dest').addEventListener('click', () => {
            mapSelectionMode = 'destination';
            map.getContainer().style.cursor = 'crosshair';
            document.getElementById('status-text').innerText = "Haz clic en el mapa para seleccionar destino";
        });

        map.on('click', async (e) => {
            if (!mapSelectionMode) return;

            const lat = e.latlng.lat;
            const lng = e.latlng.lng;

            // Remove temp marker if exists
            if (tempMarker) {
                map.removeLayer(tempMarker);
            }

            // Add marker
            tempMarker = L.marker([lat, lng]).addTo(map);

            // Reverse geocode
            try {
                const res = await axios.get('https://nominatim.openstreetmap.org/reverse', {
                    params: {
                        lat,
                        lon: lng,
                        format: 'json'
                    }
                });

                const place = {
                    lat,
                    lon: lng,
                    display_name: res.data.display_name,
                    alias: res.data.display_name.split(',')[0]
                };

                if (mapSelectionMode === 'destination') {
                    currentPlace = place;
                    destInput.value = place.alias;
                    document.getElementById('fav-btn').style.display = 'block';
                    findBestLines({ lat, lng }, originLocation);
                } else {
                    originLocation = { lat, lng };
                    originInput.value = place.alias;
                }

                document.getElementById('status-text').innerText = "Ubicación seleccionada";
            } catch (err) {
                console.error('Reverse geocode error:', err);
            }

            map.getContainer().style.cursor = '';
            mapSelectionMode = null;
        });

        // === FAVORITES ===
        function getFavorites() {
            try { return JSON.parse(localStorage.getItem('redbus_favorites') || '[]'); }
            catch (e) { return []; }
        }

        function toggleFavorite() {
            if (!currentPlace) return;
            const favs = getFavorites();
            const idx = favs.findIndex(f => Math.abs(f.lat - currentPlace.lat) < 0.0001 && Math.abs(f.lon - currentPlace.lon) < 0.0001);

            if (idx >= 0) {
                favs.splice(idx, 1);
                document.getElementById('fav-btn').style.color = '#9ca3af';
            } else {
                const alias = prompt('Nombre para este favorito:', currentPlace.alias);
                if (alias) {
                    favs.push({ ...currentPlace, alias });
                    document.getElementById('fav-btn').style.color = '#fbbf24';
                }
            }
            localStorage.setItem('redbus_favorites', JSON.stringify(favs));
            renderFavorites();
        }

        function renderFavorites() {
            const favs = getFavorites();
            const container = document.getElementById('favorites-list');
            const empty = document.getElementById('empty-state');

            container.innerHTML = '';
            if (favs.length === 0) {
                container.style.display = 'none';
                return;
            }

            favs.forEach(f => {
                const el = document.createElement('div');
                el.className = 'line-card';
                el.style.padding = '12px';
                el.innerHTML = `
                    <div class="line-badge" style="background:#fef3c7; color:#d97706; width:36px; height:36px; font-size:16px;">★</div>
                    <div class="line-info">
                        <div class="line-name">${f.alias}</div>
                        <div class="line-meta">${f.display_name.split(',')[0]}</div>
                    </div>
                `;
                el.onclick = () => selectPlace(f);
                container.appendChild(el);
            });

            if (destInput.value.length === 0) {
                container.style.display = 'block';
                empty.style.display = 'none';
            }
        }

        document.getElementById('fav-btn').onclick = toggleFavorite;
        renderFavorites();

        // === FIND BEST LINES ===
        async function findBestLines(dest, origin = null) {
            console.log(`findBestLines called. Lines available: ${currentLines.length}`);
            console.log(`Destination:`, dest);
            console.log(`Origin:`, origin);

            document.getElementById('status-text').innerText = "Buscando líneas cercanas...";
            document.getElementById('calculating-bar').style.display = 'block';
            document.getElementById('content').innerHTML = '<div style="padding:20px; text-align:center;">Analizando recorridos...</div>';

            const results = [];
            const total = currentLines.length;
            let processed = 0;

            // Process in batches
            const BATCH_SIZE = 5;
            const queue = [...currentLines];

            async function processBatch() {
                const batch = queue.splice(0, BATCH_SIZE);
                if (batch.length === 0) {
                    renderResults(results);
                    return;
                }

                const promises = batch.map(async (line) => {
                    try {
                        let route = await BusAPI.getRoute(line.codLinea);
                        if (!route || !route.nodos) return null;

                        const path = route.nodos.map(n => ({ lat: n.latitud, lng: n.longitud }));

                        // Calculate distance to destination
                        const projDest = Geometry.projectOnPolyline(dest, path);
                        const distDest = projDest.dist;

                        if (distDest > maxWalkDistance) return null;

                        let distOrigin = 0;
                        if (origin) {
                            const projOrigin = Geometry.projectOnPolyline(origin, path);
                            distOrigin = projOrigin.dist;

                            if (distOrigin > maxWalkDistance) return null;
                            if (projOrigin.index > projDest.index) return null; // Wrong direction
                        }

                        return {
                            line,
                            distOrigin,
                            distDest,
                            totalWalk: distOrigin + distDest,
                            path
                        };
                    } catch (e) {
                        return null;
                    }
                });

                const batchResults = await Promise.all(promises);
                const validInBatch = batchResults.filter(r => r);
                validInBatch.forEach(r => results.push(r));

                console.log(`Batch complete: ${validInBatch.length}/${batch.length} valid routes in this batch`);

                processed += batch.length;
                const progressPct = processed / total;
                document.getElementById('progress-fill').style.width = (progressPct * 100) + '%';

                document.getElementById('status-text').innerText = `Analizando líneas... ${processed}/${total} (${results.length} válidas)`;

                setTimeout(processBatch, 50);
            }

            processBatch();
        }

        async function renderResults(results) {
            console.log(`Route search complete. Valid routes found: ${results.length}`);

            document.getElementById('calculating-bar').style.display = 'none';

            if (results.length === 0) {
                document.getElementById('content').innerHTML = '<div style="padding:40px; text-align:center; color:#9ca3af;"><div style="font-size:48px; margin-bottom:16px;">😕</div><p>No se encontraron líneas cercanas.</p><p style="font-size:13px;">Intenta aumentar la distancia de caminata o busca otra dirección.</p></div>';
                document.getElementById('status-text').innerText = "Sin resultados";
                return;
            }

            // Sort by total walking distance
            results.sort((a, b) => a.totalWalk - b.totalWalk);

            document.getElementById('status-text').innerText = `Se encontraron ${results.length} líneas cercanas.`;

            let html = '';
            results.forEach(item => {
                const walkTimeOrigin = Math.ceil(item.distOrigin / 80); // ~80m/min walking speed
                const walkTimeDest = Math.ceil(item.distDest / 80);

                html += `
                    <div class="line-card" onclick="selectLine('${item.line.codLinea}')">
                        <div class="line-badge">${item.line.codLinea}</div>
                        <div class="line-info">
                            <div class="line-name">${item.line.descripcion}</div>
                            <div class="line-meta">
                                ${item.distOrigin > 0 ? `🟢 ${Math.round(item.distOrigin)}m (${walkTimeOrigin} min) · ` : ''}
                                🔴 ${Math.round(item.distDest)}m (${walkTimeDest} min)
                            </div>
                        </div>
                    </div>
                `;
            });

            document.getElementById('content').innerHTML = html;
        }

        // Route visualization
        let currentRouteLayer = null;
        let routeResults = [];

        async function renderResults(results) {
            routeResults = results; // Store for later use
            console.log(`Route search complete. Valid routes found: ${results.length}`);

            document.getElementById('calculating-bar').style.display = 'none';

            if (results.length === 0) {
                document.getElementById('content').innerHTML = '<div style="padding:40px; text-align:center; color:#9ca3af;"><div style="font-size:48px; margin-bottom:16px;">😕</div><p>No se encontraron líneas cercanas.</p><p style="font-size:13px;">Intenta aumentar la distancia de caminata o busca otra dirección.</p></div>';
                document.getElementById('status-text').innerText = "Sin resultados";
                return;
            }

            // Sort by total walking distance
            results.sort((a, b) => a.totalWalk - b.totalWalk);

            document.getElementById('status-text').innerText = `Se encontraron ${results.length} líneas cercanas.`;

            let html = '';
            results.forEach(item => {
                const walkTimeOrigin = Math.ceil(item.distOrigin / 80);
                const walkTimeDest = Math.ceil(item.distDest / 80);

                html += `
                    <div class="line-card" onclick="selectLine('${item.line.codLinea}')">
                        <div class="line-badge">${item.line.codLinea}</div>
                        <div class="line-info">
                            <div class="line-name">${item.line.descripcion}</div>
                            <div class="line-meta">
                                ${item.distOrigin > 0 ? `🟢 ${Math.round(item.distOrigin)}m (${walkTimeOrigin} min) · ` : ''}
                                🔴 ${Math.round(item.distDest)}m (${walkTimeDest} min)
                            </div>
                        </div>
                    </div>
                `;
            });

            document.getElementById('content').innerHTML = html;
        }

        function selectLine(lineId) {
            console.log('Selected line:', lineId);

            // Find the route in results
            const result = routeResults.find(r => r.line.codLinea == lineId);
            if (!result) return;

            // Remove previous route
            if (currentRouteLayer) {
                map.removeLayer(currentRouteLayer);
            }

            // Draw route on map
            const latLngs = result.path.map(p => [p.lat, p.lng]);
            currentRouteLayer = L.polyline(latLngs, {
                color: '#2563eb',
                weight: 4,
                opacity: 0.7
            }).addTo(map);

            // Fit map to route
            map.fitBounds(currentRouteLayer.getBounds(), { padding: [50, 50] });

            document.getElementById('status-text').innerText = `Mostrando ruta: Línea ${lineId}`;
        }

        function goBack() {
            document.getElementById('back-btn').style.display = 'none';
        }
    </script>

</body>

</html>
