<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tucumán Bus Radar - Destino</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --surface: #ffffff;
            --background: #f3f4f6;
            --text: #1f2937;
            --text-secondary: #6b7280;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
            background: var(--background);
            color: var(--text);
        }

        /* Sidebar & Panel */
        #panel {
            width: 380px;
            background: var(--surface);
            display: flex;
            flex-direction: column;
            z-index: 2000;
            box-shadow: 4px 0 24px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .panel-header {
            padding: 12px 20px;
            border-bottom: 1px solid #e5e7eb;
        }

        h1 {
            font-size: 20px;
            font-weight: 700;
            margin: 0 0 4px 0;
            background: linear-gradient(to right, #2563eb, #7c3aed);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            margin: 0;
        }

        /* Search Container */
        .search-container {
            position: relative;
            margin-bottom: 12px;
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px;
            padding-left: 40px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.2s;
            box-sizing: border-box;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        /* Autocomplete */
        #autocomplete-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            margin-top: 4px;
            max-height: 300px;
            overflow-y: auto;
            box-shadow: var(--shadow);
            z-index: 1000;
            display: none;
        }

        .autocomplete-item {
            padding: 12px 16px;
            cursor: pointer;
            border-bottom: 1px solid #f3f4f6;
            transition: background 0.15s;
        }

        .autocomplete-item:last-child {
            border-bottom: none;
        }

        .autocomplete-item:hover {
            background: #f9fafb;
        }

        /* Content Area */
        #content {
            flex-grow: 1;
            overflow-y: auto;
            padding: 0;
            max-height: calc(100vh - 280px);
        }

        /* Line Cards */
        .line-card {
            padding: 16px 24px;
            border-bottom: 1px solid #f3f4f6;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .line-card:hover {
            background: #f9fafb;
        }

        .line-badge {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            flex-shrink: 0;
        }

        .line-info {
            flex-grow: 1;
        }

        .line-name {
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 4px;
        }

        .line-meta {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* Back Button */
        #back-btn {
            display: none;
            padding: 8px 16px;
            background: #e5e7eb;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 12px;
            transition: background 0.2s;
        }

        #back-btn:hover {
            background: #d1d5db;
        }

        /* Map */
        #map {
            flex-grow: 1;
            height: 100%;
        }

        /* Progress Bar */
        #calculating-bar {
            display: none;
            margin-top: 10px;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }

            #panel {
                width: 100%;
                height: 40%;
                box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.1);
                order: 2;
            }

            #content {
                max-height: calc(40vh - 200px);
            }

            #map {
                height: 60%;
                order: 1;
            }

            .panel-header {
                padding: 12px 16px;
            }

            h1 {
                font-size: 20px;
            }

            .line-card {
                padding: 12px 16px;
            }
        }
    </style>
</head>

<body>

    <div id="panel">
        <div class="panel-header">
            <button id="back-btn" onclick="goBack()">← Volver</button>
            <h1>Bus Radar <span id="build-timestamp" style="font-size: 12px; color: #9ca3af; font-weight: 400;"></span>
            </h1>
            <p class="subtitle" id="status-text">Ingresa tu destino para ver sugerencias.</p>

            <!-- Origin -->
            <div class="search-container" id="origin-container" style="margin-bottom: 12px;">
                <span class="search-icon" style="color:#10b981;">🟢</span>
                <input type="text" id="origin" class="search-input" placeholder="¿Desde dónde sales?" autocomplete="off"
                    style="padding-right: 75px;">
                <button id="map-btn-origin" title="Elegir en Mapa"
                    style="position:absolute; right:40px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; font-size:18px; color:#6b7280;">🗺️</button>
                <button id="gps-btn" title="Mi Ubicación"
                    style="position:absolute; right:8px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; font-size:18px; color:#6b7280;">📍</button>
            </div>

            <!-- Destination -->
            <div class="search-container" id="search-box-container">
                <span class="search-icon" style="color:#ef4444;">🔴</span>
                <input type="text" id="destination" class="search-input" placeholder="¿A dónde vas?" autocomplete="off"
                    style="padding-right: 75px;">
                <button id="map-btn-dest" title="Elegir en Mapa"
                    style="position:absolute; right:40px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; font-size:18px; color:#6b7280;">🗺️</button>
                <button id="fav-btn"
                    style="position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; font-size:18px; color:#9ca3af; display:none;">★</button>
                <div id="autocomplete-list"></div>
            </div>

            <!-- Walking Distance Control -->
            <div style="margin: 16px 0; padding: 12px; background: #f9fafb; border-radius: 8px;">
                <label style="display: block; font-size: 13px; color: #6b7280; margin-bottom: 8px;">
                    🚶 Distancia máxima de caminata: <strong id="walk-dist-label">800m</strong>
                </label>
                <input type="range" id="walk-distance-slider" min="200" max="1500" step="100" value="800"
                    style="width: 100%; cursor: pointer;">
            </div>

            <div id="calculating-bar" style="display:none; margin-top: 10px;">
                <div style="height:4px; background:#e5e7eb; border-radius:2px; overflow:hidden;">
                    <div id="progress-fill"
                        style="width:0%; height:100%; background:var(--primary); transition: width 0.3s;"></div>
                </div>
                <div style="font-size:11px; color:#6b7280; text-align:right; margin-top:4px;">Analizando rutas...</div>
            </div>
        </div>

        <div id="content">
            <!-- Favorites List -->
            <div id="favorites-list" style="padding: 16px; display:none;"></div>

            <!-- Dynamic Content -->
            <div id="empty-state" style="padding: 40px; text-align: center; color: #9ca3af;">
                <div style="font-size: 48px; margin-bottom: 16px;">🗺️</div>
                <p>Busca una dirección en San Miguel de Tucumán o Yerba Buena.</p>
            </div>
        </div>
    </div>

    <div id="map"></div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="api.js"></script>
    <script src="geometry.js"></script>

    <script>
        // Setup Map
        const map = L.map('map').setView([-26.83, -65.20], 13);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        // Global Variables
        let currentLines = [];
        let maxWalkDistance = 800;

        // Update timestamp
        const now = new Date();
        const day = String(now.getDate()).padStart(2, '0');
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        document.getElementById('build-timestamp').textContent = `${day}/${month} ${hours}:${minutes}`;

        // Walking distance slider
        document.getElementById('walk-distance-slider').addEventListener('input', (e) => {
            maxWalkDistance = parseInt(e.target.value);
            document.getElementById('walk-dist-label').textContent = maxWalkDistance + 'm';
        });

        // Initialize - Load lines
        async function init() {
            try {
                currentLines = await BusAPI.getLines();
                console.log(`Loaded ${currentLines.length} unique lines`);
            } catch (e) {
                console.error("Failed to load lines", e);
            }
        }
        init();

        function goBack() {
            // Placeholder for back functionality
            document.getElementById('back-btn').style.display = 'none';
        }
    </script>

</body>

</html>
